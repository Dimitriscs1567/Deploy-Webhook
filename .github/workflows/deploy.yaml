name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build for Linux
        run: |
          GOOS=linux GOARCH=amd64 go build -o deployer cmd/main.go

      - name: Push to prod branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp deployer /tmp/deployer
          rm deployer

          if git fetch origin prod; then
            git checkout prod
            # prod is a deploy-artifact branch: always take main's content on conflict.
            # -X theirs resolves this on its own, but a shallow checkout can leave an
            # add/add conflict unresolved, so force any remainder to main's version.
            if ! git merge origin/main --no-edit -X theirs --allow-unrelated-histories; then
              git checkout --theirs -- .
              git add -A
              git commit --no-edit
            fi
          else
            git checkout -B prod
          fi

          cp /tmp/deployer deployer
          git add -f deployer
          git diff --cached --quiet || git commit -m "Build $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin prod
